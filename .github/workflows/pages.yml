# main 에 합쳐질 때마다 게임을 빌드해 GitHub Pages 에 올린다
# 주소: https://ddy234567890.github.io/tidelocked-habitat/
name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: experiments/teegarden-terrain-v4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: experiments/teegarden-terrain-v4/dist
      - id: deployment
        uses: actions/deploy-pages@v4
