<div class="wrap">
  <h1>기지 5주 플레이테스트</h1>
  <p class="sub">선지를 골라 5주를 보내고, 엔딩 판정이 납득되는지 확인하는 테스트용 페이지예요. 숫자는 모두 플레이테스트용 가정값이에요.</p>

    <div class="gauges" id="gauges"></div>
    <div class="meta"><span id="wk"></span><label class="tog"><input type="checkbox" id="tester"> 테스터 모드 (숫자·사건 일정 보기)</label></div>
  </div>

<script>
// ===== ENGINE START =====
const KEYS = ['A','W','F','E'];
const NAME = {A:'공기', W:'물', F:'식량', E:'전력'};
const SUBJ = {A:'공기가', W:'물이', F:'식량이', E:'전력이'};
const OBJ = {A:'공기를', W:'물을', F:'식량을', E:'전력을'};
const DEMAND = {A:-8, W:-13, F:-15, E:-12}; // 이주민 입주 후 추가 수요(주당)
const EVENT_INFO = {
  outage:  {name:'정전', text:'주 전원이 한동안 멈췄어요.'},
  contam:  {name:'수원 오염', text:'물을 끌어오던 곳에 오염 물질이 섞였어요.'},
  flare:   {name:'별 활동 폭발', text:'별이 갑자기 강한 빛과 입자를 뿜었어요.'},
  breakdown:{name:'공기 장치 고장', text:'산소를 만드는 장치 하나가 멈췄어요.'}
};

function clamp(v){ return Math.max(-50, Math.min(100, Math.round(v))); }

function newGame(rand){
  rand = rand || Math.random;
  const types = ['outage','contam','flare','breakdown'];
  for(let i=types.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[types[i],types[j]]=[types[j],types[i]];}
  const weeks = [2,3,4]; weeks.splice(Math.floor(rand()*3),1);
  return {
    S:{A:60,W:60,F:60,E:60},
    R:{A:-2,W:-2,F:-3,E:-2},
    f:{}, harvest:[], log:[], dead:null, picks:[],
    events:{[weeks[0]]:types[0],[weeks[1]]:types[1]},
    eventLog:[]
  };
}

function imm(g,k,v,why){ g.S[k]=clamp(g.S[k]+v); g.log.push({t:'imm',k,v,why}); }
function rate(g,k,v,why){ g.R[k]+=v; g.log.push({t:'rate',k,v,why}); }

function checkDead(g,w){
  if(g.dead) return;
  for(const k of KEYS){ if(g.S[k]<=0){ g.dead={k,week:w}; return; } }
}

function harvestAt(g,week){
  const out={A:0,W:0,F:0,E:0};
  for(const h of g.harvest){ if(week>=h.start){ for(const k of KEYS) out[k]+=(h[k]||0); } }
  return out;
}

function endWeek(g,w){
  const before={...g.S};
  const hv=harvestAt(g,w);
  for(const k of KEYS) g.S[k]=clamp(g.S[k]+g.R[k]+hv[k]);
  const ev=g.events[w]; let evRes=null;
  if(ev){ evRes=applyEvent(g,ev); g.eventLog.push({week:w,type:ev,res:evRes}); }
  checkDead(g,w);
  return {before, after:{...g.S}, hv, ev, evRes};
}

function applyEvent(g,type){
  const f=g.f, d={A:0,W:0,F:0,E:0}, why=[];
  if(type==='outage'){
    d.E-=6; why.push('발전이 멈춰 저장 전력을 꺼내 씀');
    if(f.reactor){ d.E-=3; why.push('원자로는 다시 켜는 데 오래 걸림'); }
    if(f.backup===2){ d.E+=3; why.push('구역별 예비 전원이 일부를 버텨 줌'); }
    d.A-=5;
    if(f.airZones){ d.A+=3; why.push('공기 장치가 나뉘어 있어 일부만 멈춤'); }
    if(f.hotRisk){ d.A-=3; why.push('냉방이 멈춰 기지가 빨리 더워짐'); }
  }
  if(type==='contam'){
    d.W-=f.single?9:4; why.push(f.single?'수원이 한 곳뿐이라 공급이 크게 끊김':'여러 방식으로 물을 얻어 피해가 적음');
    if(f.tanks===2){ d.W+=3; why.push('구역별 탱크라 깨끗한 물이 일부 남음'); }
    if(f.crop==='algae'){ d.F-=3; why.push('조류 배양액도 오염됨'); }
  }
  if(type==='flare'){
    if(f.solar){ d.E-=6; why.push('태양광 패널 효율이 떨어짐'); } else { d.E-=2; why.push('원자로라 영향이 작음'); }
    if(f.gh){ d.F-=4; why.push('지상 온실 작물이 피해를 입음'); }
    if(f.build==='A1'){ d.A-=4; why.push('지상에 그대로 노출된 기지라 피해가 큼'); }
    if(f.build==='B1'){ d.E-=3; why.push('동굴 입구 쪽 설비가 영향을 받음'); }
  }
  if(type==='breakdown'){
    if(f.centralAir){ d.A-=8; why.push('중앙 장치 하나에 의존해 전체 공기가 줄어듦'); }
    else { d.A-=3; why.push('나머지 장치가 버텨 줌'); }
    if(f.layout==='C1'){ d.A-=3; why.push('모여 있는 구조라 고장 영향이 여러 동으로 번짐'); }
    if(f.maint){ d.A+=2; why.push('회수 설비 정비 인력이 빨리 고침'); }
  }
  for(const k of KEYS) g.S[k]=clamp(g.S[k]+d[k]);
  return {d,why};
}

// 입주 후 4주 정상 운영 검증
function verify(g){
  const S={...g.S}; const trace=[{...S}];
  for(let i=0;i<4;i++){
    const w=6+i; const hv=harvestAt(g,w);
    let m=1;
    if(g.f.staged && i<2) m=0.5;
    for(const k of KEYS){
      let v=S[k]+g.R[k]+hv[k]+DEMAND[k]*m;
      if(g.f.staged){ if(k==='F'||k==='E') v-=1; }
      if(k==='W'){ if(g.f.regen) v+=2*m; if(g.f.recover) v+=1*m; }
      if(g.f.share){ const low=KEYS.reduce((a,b)=>S[a]<=S[b]?a:b); if(k===low) v+=3; }
      S[k]=clamp(v);
    }
    trace.push({...S});
    for(const k of KEYS){ if(S[k]<=0) return {ok:false,k,week:i+1,trace}; }
  }
  return {ok:true,trace};
}

// 대표 고장 시뮬레이션 2종
function stress(g){
  const f=g.f;
  const out={E:42, A:24};
  out.E -= f.backup===2?14:8;
  if(f.reactor) out.E += 6;
  if(f.isolate) out.E -= 6;
  if(f.share) out.E += 4;
  if(f.airZones) out.A -= 7;
  if(f.backup===2) out.A -= 4;
  if(f.hotRisk) out.A += 4;
  if(f.isolate) out.A -= 4;
  if(f.share) out.A += 4;
  const wat={W:40, F:0};
  wat.W -= (f.tanks||1)*7;
  if(f.recover) wat.W -= 4;
  if(f.isolate) wat.W -= 3;
  if(f.crop) wat.F = 4;
  const tests=[{name:'주 전원 정지', d:out},{name:'주 정수 설비 고장', d:wat}];
  const res=tests.map(t=>{
    const S={...g.S}; for(const k in t.d) S[k]-=Math.max(0,t.d[k]);
    const low=KEYS.reduce((a,b)=>S[a]<=S[b]?a:b);
    return {name:t.name, S, low, min:S[low]};
  });
  if(f.reinforce){
    const worst=res.reduce((a,b)=>a.min<=b.min?a:b);
    const t=tests[res.indexOf(worst)];
    const S={...g.S}; for(const k in t.d) S[k]-=Math.max(0,t.d[k]-12);
    const low=KEYS.reduce((a,b)=>S[a]<=S[b]?a:b);
    res[res.indexOf(worst)]={name:t.name+' (보강함)', S, low, min:S[low]};
  }
  const worst=res.reduce((a,b)=>a.min<=b.min?a:b);
  return {B:worst.min, worst, res};
}

function judge(g){
  if(g.dead) return {code:'E1', cause:g.dead.k};
  const M=Math.min(...KEYS.map(k=>g.S[k]));
  const Mk=KEYS.reduce((a,b)=>g.S[a]<=g.S[b]?a:b);
  const H=verify(g); const B=stress(g);
  if(M<30) return {code:'E2',cause:Mk,M,H,B};
  if(!H.ok) return {code:'E3',cause:H.k,M,H,B};
  if(M<60||B.B<30) return {code:'E4',cause:B.B<30?B.worst.low:Mk,M,H,B,weakBy:B.B<30?'test':'low'};
  return {code:'E5',M,H,B};
}

// ===== DATA =====
const WEEKS = [
 { n:1, title:'거점·생명유지', goal:'안전하게 머물고 숨 쉴 공간을 확보해요.',
   situation:g=>'착륙선에는 임시 전원, 비축 물, 비축 식량, 비상 산소가 실려 있어요. 이 자원으로 버티면서 첫 기지를 세워야 해요.',
   decisions:[
   { q:'① 거점 위치 — 어떤 환경의 위험을 감수할까요?', options:g=>[
     {id:'A',name:'A. 낮 쪽 평지',line:'넓지만, 별빛에 그대로 노출돼요.',
      easy:'운동장처럼 넓은 땅이라 기지를 펼치고 넓히기 쉬워요. 대신 그늘이 없어 하루 종일 별빛을 받으니, 기지를 식히는 데 전기가 계속 들어요.',
      gain:'설치 간단, 태양광·온실 자리 넉넉',cost:'냉방 전력이 매주 듦',survey:'깊이 조사: 먼지와 빛의 세기를 재면 2주 태양광 효율을 미리 알 수 있어요.',
      apply:g=>{g.f.loc='A';g.f.solarK=1;g.f.ghK=1.2;g.f.water='far';imm(g,'E',-2,'평지라 설치가 간단');rate(g,'E',-2,'별빛 노출로 냉방 필요');}},
     {id:'B',name:'B. 용암동굴',line:'바위가 지붕이 되지만, 드나들기 불편해요.',
      easy:'두꺼운 바위 천장이 우산처럼 바깥 환경을 막아 줘요. 그래서 냉방 걱정은 적어요. 대신 장비를 안으로 옮기고 전선을 길게 깔아야 해요.',
      gain:'냉방 부담 적음, 안에 물이 있을 가능성',cost:'처음 설치 전력 큼, 지상 설비와 멀어짐',survey:'깊이 조사: 안쪽 바위의 안정성과 대체 출구를 확인해요.',
      apply:g=>{g.f.loc='B';g.f.solarK=0.75;g.f.ghK=0.8;g.f.water='cave';imm(g,'E',-6,'장비를 동굴 안으로 옮김');}},
     {id:'C',name:'C. 낮·밤 경계 능선',line:'빛은 잘 받지만, 평평한 땅이 부족해요.',
      easy:'언덕 위처럼 가리는 게 적어 빛을 잘 받아요. 반대쪽 그늘 비탈에는 얼음이 있을지도 몰라요. 대신 비탈이라 땅을 다지는 공사가 필요해요.',
      gain:'빛 확보, 그늘 쪽 얼음 가능성',cost:'기초 공사 전력, 냉방 약간',survey:'깊이 조사: 비탈의 안정성과 그늘 위치를 확인해요.',
      apply:g=>{g.f.loc='C';g.f.solarK=1;g.f.ghK=1;g.f.water='ice';imm(g,'E',-4,'비탈을 다지는 공사');rate(g,'E',-1,'낮 쪽 빛으로 약간의 냉방');}}
   ]},
   { q:'② 기지 구축 방식 — 위치에 맞는 두 가지 중 골라요.', options:g=>({
     A:[
      {id:'A1',name:'A-1. 지상 전개형',line:'빨리 펼치고, 설비로 버텨요.',
       easy:'가져온 기지 모듈을 바로 펼쳐요. 처음엔 전력이 거의 안 들어요. 대신 바깥에 그대로 있어서 냉방을 더 세게 돌려야 하고, 정전이 나면 금방 더워져요.',
       gain:'처음 전력 아낌',cost:'매주 냉방 전력↑, 정전·별 활동에 약함',

const main=$('#main');

function cloneG(g){return {S:{...g.S},R:{...g.R},f:{...g.f},harvest:g.harvest.map(h=>({...h})),log:g.log.slice(),dead:g.dead,picks:g.picks.slice(),events:g.events,eventLog:g.eventLog.slice()};}
const sgn=v=>(v>0?'+':'')+v;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function color(v){return v>=60?'var(--good)':v>=30?'var(--warn)':'var(--bad)';}

function drawGauges(){
  $('#gbar').hidden=false;
  $('#gauges').innerHTML=KEYS.map(k=>{const v=Math.max(0,G.S[k]);const r=G.R[k];
    return `<div class="g"><div class="top"><span>${NAME[k]}</span><span class="val" style="color:${color(v)}">${v}</span></div>
    <div class="track"><div class="fill" style="width:${v}%;background:${color(v)}"></div></div>
    <div class="rate">매주 ${sgn(r)}</div></div>`;}).join('');
  const evs=Object.entries(G.events).map(([w,t])=>w+'주 '+EVENT_INFO[t].name).join(', ');
  $('#wk').textContent=(wi<5?(wi+1)+'주차 · ':'')+'0점이 되면 즉시 실패 · 30점 미만 위험'+(tester?' · 사건 일정: '+evs:'');
}

  <tr><td>E3 시한부 정착</td><td style="text-align:left;white-space:normal">최저점 30 이상, 입주 후 4주 검증 실패</td></tr>
  <tr><td>E4 취약한 정착</td><td style="text-align:left;white-space:normal">검증 통과, 그러나 최저점 60 미만 또는 고장 시뮬레이션 30 미만</td></tr>
  <tr><td>E5 안정적 이주</td><td style="text-align:left;white-space:normal">최저점 60 이상, 검증 통과, 고장 시뮬레이션 30 이상</td></tr></table>
  <div class="row"><button class="btn" id="go">1주차 시작</button></div></section>`;
  $('#go').onclick=()=>{G=newGame();wi=0;allNames=[];beginWeek();};
}

function beginWeek(){snap=cloneG(G);weekPicks=[];render();window.scrollTo(0,0);}

function rebuild(){
  G=cloneG(snap);G.log=[];
  const W=WEEKS[wi];
  weekNames=[];
  weekPicks.forEach((id,i)=>{const o=W.decisions[i].options(G).find(o=>o.id===id);o.apply(G);G.picks.push(id);weekNames.push({w:W.n,name:o.name,why:o.line});});
}

function preview(opt){
  const h=cloneG(G);h.log=[];opt.apply(h);
  const parts=[];
  const im=h.log.filter(l=>l.t==='imm').map(l=>NAME[l.k]+' '+sgn(l.v));
  const rt=h.log.filter(l=>l.t==='rate').map(l=>NAME[l.k]+' '+sgn(l.v));
  if(im.length)parts.push('즉시: '+im.join(', '));
  if(rt.length)parts.push('매주: '+rt.join(', '));
  if(h.harvest.length>G.harvest.length){const hv=h.harvest[h.harvest.length-1];parts.push((hv.start<=5?hv.start+'주차부터':'입주 후 '+(hv.start-5)+'주째부터')+' 매주 식량 +'+hv.F+(hv.A?', 공기 +'+hv.A:''));}
  return parts.join(' · ')||'수치 변화는 판정 단계에서 적용돼요';
}

function render(){
  if(!G){return;}
  drawGauges();
  const W=WEEKS[wi];
  let html=`<section><div class="end-code">${W.n}주차</div><h2>${W.title}</h2><div class="small">${W.goal}</div>
  <div class="situ"><b>현재 상황</b> ${esc(W.situation(snap))}</div>`;
  for(let i=0;i<3;i++){
    if(i>weekPicks.length)break;
    const D=W.decisions[i];const opts=D.options(i===0?snap:G);
    html+=`<div class="dec"><div class="q">${D.q}</div><div class="opts">`;
    for(const o of opts){
      const on=weekPicks[i]===o.id;
      html+=`<button class="opt${on?' on':''}" data-i="${i}" data-id="${o.id}" aria-pressed="${on}">
        <div class="nm">${esc(o.name)}</div><div class="ln">${esc(o.line)}</div>
        <div class="easy">${esc(o.easy)}</div>
        <div class="chips"><span class="chip gain">얻는 것 · ${esc(o.gain)}</span><span class="chip cost">감수 · ${esc(o.cost)}</span></div>
        ${o.survey?`<div class="survey">${esc(o.survey)}</div>`:''}
        ${tester?`<div class="num">${esc(previewFor(i,o))}</div>`:''}
      </button>`;
    }
    html+=`</div></div>`;
  }
  html+=`<div class="row"><button class="btn" id="fin" ${weekPicks.length<3?'disabled':''}>${wi<4?'이번 주 마치기':'이주민 받고 판정하기'}</button>
    <span class="small">${weekPicks.length<3?'결정 '+(3-weekPicks.length)+'개가 남았어요.':'이번 주를 마치면 되돌릴 수 없어요.'}</span></div></section>`;
  main.innerHTML=html;
  main.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;weekPicks=weekPicks.slice(0,i);weekPicks[i]=b.dataset.id;rebuild();render();
    const next=main.querySelectorAll('.dec')[i+1];if(next)next.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});});
  const fin=$('#fin');if(fin)fin.onclick=finishWeek;
}
function previewFor(i,o){
  // 미리보기는 해당 결정 직전 상태 기준
  const saved=G; const savedPicks=weekPicks;
  G=cloneG(snap);G.log=[];const W=WEEKS[wi];
  savedPicks.slice(0,i).forEach((id,j)=>{const op=W.decisions[j].options(G).find(x=>x.id===id);op.apply(G);});
  const r=preview(o); G=saved; return r;
}

function finishWeek(){
  const W=WEEKS[wi];
  const choiceLog=G.log.slice();
  allNames=allNames.concat(weekNames);
  const res=endWeek(G,W.n);
  showResult(W,choiceLog,res);
}

function showResult(W,choiceLog,res){
  drawGauges();
  const names=weekNames.map(n=>n.name);
  let html=`<section class="panel"><div class="end-code">${W.n}주차 결과</div><h2>이번 주에 무엇이 바뀌었나요?</h2>
  <p class="small">고른 선지: ${names.map(esc).join(' → ')}</p>`;
  const im=choiceLog.filter(l=>l.t==='imm'), rt=choiceLog.filter(l=>l.t==='rate');
  if(im.length)html+=`<h3>선택하자마자 생긴 변화</h3><ul class="clean">${im.map(l=>`<li><span class="${l.v>0?'pos':'neg'}">${NAME[l.k]} ${sgn(l.v)}</span> — ${esc(l.why)}</li>`).join('')}</ul>`;
  if(rt.length)html+=`<h3>다음부터 매주 달라지는 것</h3><ul class="clean">${rt.map(l=>`<li><span class="${l.v>0?'pos':'neg'}">${NAME[l.k]} 매주 ${sgn(l.v)}</span> — ${esc(l.why)}</li>`).join('')}</ul>`;
  const hvTxt=KEYS.filter(k=>res.hv[k]).map(k=>NAME[k]+' +'+res.hv[k]);
  html+=`<h3>한 주가 지나며</h3><p class="small">매주 쓰는 양과 만드는 양이 반영됐어요${hvTxt.length?' (수확: '+hvTxt.join(', ')+')':''}.</p>`;
  if(res.ev){const e=EVENT_INFO[res.ev];
    html+=`<div class="ev"><b>돌발 사건 · ${e.name}</b><br>${e.text}<ul class="clean">${res.evRes.why.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>
    <span class="small">피해: ${KEYS.filter(k=>res.evRes.d[k]).map(k=>NAME[k]+' '+sgn(res.evRes.d[k])).join(', ')}</span></div>`;}
  html+=`<div class="tbl"><table><tr><th></th>${KEYS.map(k=>`<th>${NAME[k]}</th>`).join('')}</tr>
    <tr><td>이번 주 시작</td>${KEYS.map(k=>`<td>${snap.S[k]}</td>`).join('')}</tr>
    <tr><td>이번 주 끝</td>${KEYS.map(k=>`<td style="color:${color(G.S[k])}">${Math.max(0,G.S[k])}</td>`).join('')}</tr></table></div>`;
  const last=wi===4||G.dead;
  html+=`<div class="row"><button class="btn" id="nx">${G.dead?'결과 보기':last?'엔딩 판정 보기':(W.n+1)+'주차로'}</button></div></section>`;
  main.innerHTML=html;window.scrollTo(0,0);
  $('#nx').onclick=()=>{if(last){ending();}else{wi++;beginWeek();}};
}

const E3T={A:['멈춰가는 숨','산소 공급과 공기 처리 능력이 입주 인원을 감당하지 못했어요.'],W:['마지막 물탱크','비축수는 충분해 보였지만, 회수와 보충이 소비를 따라가지 못했어요.'],F:['첫 수확 전의 겨울','재배 시설은 준비됐지만, 첫 수확까지 버틸 비축 식량이 부족했어요.'],E:['꺼져가는 기지','설비를 늘린 만큼 전력 수요도 늘었고, 공급이 따라가지 못했어요.']};
const E1T={A:['숨이 멎은 기지','공기를 유지할 여유가 바닥났어요.'],W:['말라버린 탱크','쓸 수 있는 물이 바닥났어요.'],F:['빈 식량 창고','먹을 것이 바닥났어요.'],E:['꺼진 불빛','전력이 바닥나 생명유지 장치가 멈췄어요.']};
const ENDNAME={E1:'생존 실패',E2:'수용 준비 미달',E3:'시한부 정착',E4:'취약한 정착',E5:'안정적 이주'};

function strategy(f){
  const t=[];
  if(f.recover||f.regen)t.push('물을 되살려 쓰는 회수 중심');
  if(f.zones||f.airZones||f.backup===2||f.tanks===2||f.isolate)t.push('구역을 나눠 피해를 막는 분산 중심');
  if(f.reactor)t.push('일정한 원자로 전력');
  if(t.length===0)t.push('단순하고 가벼운 설비 중심');
  return t.join(', ');
}

function ending(){
  const j=judge(G);
  $('#gbar').hidden=true;
  let title,line;
  if(j.code==='E1'){[title,line]=E1T[j.cause];line=G.dead.week+'주차에 '+line;}
  else if(j.code==='E2'){title='여유 없는 기지';line=SUBJ[j.cause]+' '+G.S[j.cause]+'점으로 너무 낮아, 연구원은 버텼지만 이주민을 받을 여유가 없어요.';}
  else if(j.code==='E3'){[title,line]=E3T[j.cause];line+=' 입주 후 '+j.H.week+'주째에 '+SUBJ[j.cause]+' 바닥나요.';}
  else if(j.code==='E4'){title=j.weakBy==='test'?'멈추면 함께 멈추는 기지':'빠듯한 일상';
    line=j.weakBy==='test'?'평소에는 운영되지만, "'+j.B.worst.name+'" 때 '+SUBJ[j.B.worst.low]+' '+j.B.worst.min+'점까지 떨어져요.':'고장에는 대비했지만, '+SUBJ[j.cause]+' '+G.S[j.cause]+'점이라 여유가 적어요.';}
  else {title='새 행성의 첫 마을';line='계획한 인원과 기간을 버티고, 대표적인 고장에도 대비된 기지예요. 전략: '+strategy(G.f)+'.';}
  if(G.f.crop==='staple'&&j.code!=='E1')line+=' 밭에는 감자와 밀이 자라고 있어요. 다음 계절에는 기지가 스스로 먹고살 수 있을 거예요.';

  const pickNames=allNames;

  let html=`<section class="panel"><div class="end-code">${j.code} · ${ENDNAME[j.code]}</div><div class="end-title">「${title}」</div><p>${esc(line)}</p>
  <div class="verdict">
    <div class="vbox"><div class="k">최저점 M (60 이상이면 여유)</div><div class="v" style="color:${color(j.M??0)}">${j.M??'—'}</div></div>
    <div class="vbox"><div class="k">입주 후 4주 운영 검증</div><div class="v" style="color:${j.H?(j.H.ok?'var(--good)':'var(--bad)'):'var(--muted)'}">${j.H?(j.H.ok?'통과':'실패'):'—'}</div></div>
    <div class="vbox"><div class="k">고장 시뮬레이션 최저점 B (30 이상)</div><div class="v" style="color:${color(j.B?j.B.B:0)}">${j.B?j.B.B:'—'}</div></div>
  </div>`;
  html+=`<h3>최종 게이지</h3><div class="tbl"><table><tr>${KEYS.map(k=>`<th>${NAME[k]}</th>`).join('')}</tr><tr>${KEYS.map(k=>`<td style="color:${color(G.S[k])}">${Math.max(0,G.S[k])}</td>`).join('')}</tr></table></div>`;
  if(j.H){html+=`<h3 style="margin-top:16px">입주 후 4주 예측</h3><div class="tbl"><table><tr><th>시점</th>${KEYS.map(k=>`<th>${NAME[k]}</th>`).join('')}</tr>
    ${j.H.trace.map((s,i)=>`<tr><td>${i===0?'입주 직전':'입주 '+i+'주째'}</td>${KEYS.map(k=>`<td style="color:${color(s[k])}">${Math.max(0,s[k])}</td>`).join('')}</tr>`).join('')}</table></div>`;}
  if(j.B){html+=`<h3 style="margin-top:16px">고장 시뮬레이션</h3><ul class="clean">${j.B.res.map(r=>`<li>${esc(r.name)}: 가장 낮아지는 것은 ${NAME[r.low]} <b style="color:${color(r.min)}">${r.min}점</b></li>`).join('')}</ul>`;}
  if(G.eventLog.length){html+=`<h3 style="margin-top:16px">겪은 돌발 사건</h3><ul class="clean">${G.eventLog.map(e=>`<li>${e.week}주차 ${EVENT_INFO[e.type].name} — ${esc(e.res.why[0]||'')}</li>`).join('')}</ul>`;}
  html+=`<h3 style="margin-top:16px">이 결과를 만든 선택</h3><div class="tbl"><table><tr><th>주차</th><th style="text-align:left">선택</th><th style="text-align:left">한 줄 요약</th></tr>
    ${pickNames.map(p=>`<tr><td>${p.w}주</td><td style="text-align:left">${esc(p.name)}</td><td style="text-align:left;white-space:normal">${esc(p.why)}</td></tr>`).join('')}</table></div>
  <div class="row"><button class="btn" id="again">다시 하기</button><button class="btn ghost" id="copy">결과 복사</button><span class="small" id="copied"></span></div></section>`;
  main.innerHTML=html;window.scrollTo(0,0);
  $('#again').onclick=()=>{G=null;$('#gbar').hidden=true;start();};
  $('#copy').onclick=()=>{
    const txt=`[${j.code} ${ENDNAME[j.code]}] ${title}\n최종: ${KEYS.map(k=>NAME[k]+' '+G.S[k]).join(' / ')}\nM ${j.M??'-'} · 검증 ${j.H?(j.H.ok?'통과':'실패'):'-'} · B ${j.B?j.B.B:'-'}\n선택: ${pickNames.map(p=>p.name).join(' → ')}\n사건: ${G.eventLog.map(e=>e.week+'주 '+EVENT_INFO[e.type].name).join(', ')||'없음'}`;
    navigator.clipboard.writeText(txt).then(()=>{$('#copied').textContent='복사했어요. 팀 채팅에 붙여 넣으세요.';}).catch(()=>{$('#copied').textContent='복사가 막혀 있어요. 위 표를 직접 선택해 복사해 주세요.';});
  };
}

start();
</script>

</body></html>
