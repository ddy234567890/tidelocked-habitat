<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tidelocked Habitat</title>
    <style>
      /* 화면 색 토큰 (CLAUDE.md "색" 규칙) */
      :root {
        color-scheme: dark;
        --bg: #02040C; --panel: #0A1434; --panel-picked: #0E1B48;
        --line: #2B47C4; --line-dim: #1A2B72; --deep: #1B2A9C;
        --hi: #8FC1FF; --cream: #E8DFC8; --text: #DCE6FF; --muted: #8C9DD0; --amber: #F2B84B;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
      #viewport { width: 100%; height: 100%; display: block; background: #000; }
      /* 데모용 버튼 (composer가 생기면 지운다) */
      #demo-ui { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(100% - 32px, 900px); display: flex; flex-direction: column; align-items: center; gap: 8px; }
      #demo-ui .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
      #demo-ui .row span { color: var(--muted); font: 13px system-ui, sans-serif; min-width: 3em; }
      #stats { position: fixed; top: 16px; left: 16px; color: var(--hi); font: 14px system-ui, sans-serif; background: var(--panel); border: 1px solid var(--line-dim); border-radius: 8px; padding: 8px 12px; }
      #flow-ui { position: fixed; top: 16px; right: 16px; }
      #demo-ui button, #flow-ui button { font: 14px system-ui, sans-serif; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer; white-space: nowrap; }
      #demo-ui button:hover, #flow-ui button:hover { color: var(--hi); }
      #demo-ui button[aria-pressed="true"], #flow-ui button[aria-pressed="true"] { background: var(--panel-picked); border-color: var(--cream); color: var(--cream); }
    </style>
  </head>
  <body>
    <canvas id="viewport"></canvas>
    <div id="stats"></div>
    <div id="flow-ui"><button id="break-flow" aria-pressed="false">관 끊기</button></div>
    <div id="demo-ui"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
