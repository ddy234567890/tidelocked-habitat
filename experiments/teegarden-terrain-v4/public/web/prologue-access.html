/* 공통 토큰: 색·선·발광 세기는 여기서만 바꿔요 */
:root{
  --bg:#02040C;--panel:rgba(3,8,26,.88);--text:#DCEBFF;--acc:#3D8BFF;--hi:#8CC4FF;--dim:#6A8CC8;
  --line:rgba(61,139,255,.62);--line-dim:rgba(61,139,255,.25);
  --glow:0 0 8px rgba(30,110,255,.85);--glow-s:0 0 4px rgba(30,110,255,.45);
  --scan:.22;--vig:.55;
  --topH:44px;--infoW:348px;--routeH:112px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:"UniPix","Noto Sans KR",monospace;font-size:16px;line-height:24px;-webkit-font-smoothing:none;text-shadow:var(--glow-s)}
canvas#gl{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
body.explore canvas#gl{cursor:grab}body.dragging canvas#gl{cursor:grabbing}
.crt{position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,rgba(0,0,0,var(--scan)) 3px,rgba(0,0,0,var(--scan)) 4px)}
.vig{position:fixed;inset:0;pointer-events:none;z-index:49;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,var(--vig)) 100%)}
#black{position:fixed;inset:0;background:#000;z-index:80;pointer-events:none;opacity:0;transition:opacity .3s steps(4)}
#black.on{opacity:1;transition:none}
.en{color:var(--acc);letter-spacing:1px;text-shadow:var(--glow)}
.dim{color:var(--dim)}
.chip{display:inline-block;color:var(--dim);padding:0 2px;line-height:18px;white-space:nowrap;margin-left:6px}
button{font:inherit;line-height:24px;color:var(--text);background:transparent;border:1px solid var(--line);padding:2px 10px;cursor:pointer;border-radius:0;text-shadow:inherit;transition:background .15s steps(2),color .15s steps(2)}
button:hover{background:rgba(61,139,255,.2)}
button:focus-visible{outline:2px solid var(--text);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button.main{background:var(--acc);color:var(--bg);border-color:var(--acc);text-shadow:none;box-shadow:var(--glow)}
button.main:hover{background:var(--hi)}

#top{position:fixed;left:16px;right:16px;top:12px;height:var(--topH);z-index:30;display:flex;align-items:center;gap:16px;padding:0 14px;white-space:nowrap;background:linear-gradient(rgba(2,4,12,.7),transparent);opacity:0;transition:opacity .3s steps(3)}
body.frame #top{opacity:1}
#top .sp{flex:1}
#title{text-shadow:var(--glow)}

/* 로그인 */
#login{position:fixed;left:max(48px,8vw);top:50%;transform:translateY(-50%);width:min(520px,calc(100vw - 96px));z-index:20;background:var(--panel);border:1px solid var(--line);box-shadow:var(--glow-s);opacity:0;visibility:hidden;transition:opacity .3s steps(3)}
body.loginOn #login{opacity:1;visibility:visible}
#login .bar{display:flex;justify-content:space-between;padding:0 12px;height:32px;line-height:32px;white-space:nowrap}
#login .body{padding:16px}
#sys p,#seq p{min-height:24px}
#form{margin-top:14px}
.inrow{display:flex;gap:8px;margin-top:6px}
#nick{flex:1;min-width:0;font:inherit;font-size:32px;line-height:40px;height:48px;color:var(--text);background:var(--bg);border:1px solid var(--line);padding:2px 10px;caret-color:var(--acc);border-radius:0}
#nick:focus{outline:none;border-color:var(--hi);box-shadow:var(--glow)}
#nick::placeholder{color:#1A2E66}
#go{height:48px}
#err{min-height:24px;margin-top:4px}
#err:not(:empty)::before{content:"! ";color:var(--acc)}
#guest{margin-top:6px;width:100%}
.demo{margin-top:12px;padding-top:10px;border-top:1px dotted var(--line-dim);color:var(--dim)}
#fx{position:fixed;border:1px solid var(--line);z-index:25;pointer-events:none;display:none;transition:left .6s,top .6s,width .6s,height .6s,opacity .6s}

/* 로그인 이후 */
.hud{visibility:hidden;opacity:0;transition:opacity .5s steps(5)}
body.explore .hud{visibility:visible;opacity:1}
#view{position:fixed;top:calc(12px + var(--topH));left:16px;right:16px;bottom:calc(12px + var(--routeH));z-index:16;pointer-events:none}
#vname{position:absolute;left:14px;top:10px}
#vname b{display:block;font-weight:normal;font-size:32px;line-height:40px;text-shadow:var(--glow)}
#ctl{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);display:flex;gap:2px;pointer-events:auto}
#ctl button{border-color:transparent;color:var(--dim)}
#ctl button:hover{color:var(--text)}
#ctl #coast{border-color:var(--line-dim);margin-left:8px}
#ctl #coast[aria-pressed="true"]{color:var(--bg);background:var(--hi);border-color:var(--hi);text-shadow:none}
#hint{position:absolute;left:14px;bottom:8px;color:var(--dim)}
#warp{position:absolute;left:0;right:0;top:50%;margin-top:-12px;text-align:center;color:var(--hi);text-shadow:var(--glow);letter-spacing:1px;opacity:0;transition:opacity .3s steps(3)}
#warp.on{opacity:1}

/* 천체 표시 */
#marks{position:fixed;inset:0;z-index:17;pointer-events:none}
.mk{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;transition:opacity .45s}
.mk b{position:absolute;left:-13px;top:-13px;width:26px;height:26px;cursor:pointer;pointer-events:auto}
.mk b::before,.mk b::after{content:"";position:absolute;background:var(--hi);box-shadow:var(--glow-s)}
.mk b::before{left:12px;top:4px;width:2px;height:5px;box-shadow:0 13px 0 var(--hi)}
.mk b::after{left:4px;top:12px;width:5px;height:2px;box-shadow:13px 0 0 var(--hi)}
.mk b:focus-visible{outline:2px solid var(--text)}
.mk span{position:absolute;left:16px;top:-12px;white-space:nowrap;color:var(--dim);padding:0 4px;background:rgba(2,4,12,.7);pointer-events:none}
.mk.dest span{color:var(--hi);text-shadow:var(--glow)}
.mk b:hover+span,.mk b:focus-visible+span,.mk.sel span{color:var(--text);text-shadow:var(--glow)}
.mk.edge b{display:none}
.mk.edge span{left:0;top:0;transform:translate(-50%,-50%);color:var(--hi);text-shadow:var(--glow);pointer-events:auto;cursor:pointer;background:radial-gradient(rgba(2,4,12,.8),transparent 75%);padding:4px 10px}
#track{position:fixed;left:0;top:0;width:44px;height:44px;z-index:17;pointer-events:none;display:none}
#track i{position:absolute;width:10px;height:10px;border:2px solid var(--hi);box-shadow:var(--glow-s)}
#track i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}#track i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
#track i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}#track i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}

#info{position:fixed;top:calc(16px + var(--topH));right:20px;bottom:calc(16px + var(--routeH));width:var(--infoW);z-index:22;
  background:linear-gradient(to left,rgba(3,10,34,.92),rgba(3,10,34,.78) 85%,rgba(3,10,34,0));box-shadow:24px 0 48px rgba(20,90,255,.18) inset;
  overflow:auto;padding:8px 6px 8px 22px;-webkit-mask-image:linear-gradient(transparent,#000 28px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(transparent,#000 28px,#000 calc(100% - 28px),transparent);transform:translateX(calc(100% + 28px));opacity:0;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s}
body.explore #info.open{transform:none;opacity:1}
#info.sw{opacity:0!important}
#info .x{position:absolute;right:6px;top:6px;border:0;color:var(--dim);font-size:16px;padding:0 8px}
#info .x:hover{color:var(--text);background:none}
#info .hd{padding:14px 14px 18px}
#info .hd b{display:block;font-weight:normal;font-size:32px;line-height:40px;text-shadow:var(--glow)}
#info .r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px}
#info .r .k{color:var(--acc);text-shadow:var(--glow);letter-spacing:1px}
#info .r .k small{display:block;font-size:16px;color:var(--dim);letter-spacing:0;text-shadow:none}
#info .r .v{text-align:right}
#info p{padding:10px 14px}
#info .act{display:grid;gap:8px;padding:8px 14px 14px}
#info .act button:not(.main){border-color:transparent;color:var(--dim)}
#info .act button:not(.main):hover{color:var(--text)}
#infoBtn{border-color:transparent;color:var(--hi)}
#route{position:fixed;left:16px;right:16px;bottom:12px;height:var(--routeH);z-index:20;background:linear-gradient(transparent,rgba(2,4,12,.75))}
#route .cap{position:absolute;left:14px;top:6px}
#route .note{position:absolute;right:14px;top:6px;color:var(--dim)}
#track2{position:absolute;left:14%;right:14%;top:62px;height:0;border-top:1px dashed var(--line)}
#track2 .dist{position:absolute;left:38%;top:-30px;transform:translateX(-50%);white-space:nowrap;background:var(--bg);padding:0 8px}
.stop{position:absolute;top:-22px;transform:translateX(-50%);border:0;padding:0 6px;text-align:center;line-height:20px;white-space:nowrap;color:var(--dim);background:none}
.stop i{display:block;width:9px;height:9px;margin:17px auto 6px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 1px var(--acc),var(--glow-s)}
.stop[aria-current="true"] i{background:var(--acc);box-shadow:var(--glow)}
.stop[aria-current="true"],.stop:hover{color:var(--text);background:none}
#ship{position:absolute;top:-4px;width:7px;height:7px;margin-left:-4px;background:var(--text);border-radius:50%;box-shadow:0 0 10px 3px rgba(60,140,255,.9);pointer-events:none}

#endv{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;padding:24px}
#endv.show{display:flex}
#endv h2{font-weight:normal;font-size:32px;line-height:40px;text-shadow:var(--glow)}
#nogl{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:18;display:none;text-align:center;color:var(--dim)}

/* 티가든 유도 · 타이핑 (2026-11-18) */
.mk:not(.dest):not(.goal) span{opacity:.5;font-size:14px}

function initGL(){

  const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;};
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw new Error('link');gl.useProgram(pr);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const ap=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(ap);gl.vertexAttribPointer(ap,2,gl.FLOAT,false,0,0);
  ['uRes','uCtr','uF','uT','uDim','uRev','uWarp','uCam','uL','uGal','uB','uSpin','uSph','uTy','uSun','uNS','uTex','uCoast'].forEach(n=>U[n]=gl.getUniformLocation(pr,n));
  const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,TW,TH,0,gl.RGBA,gl.UNSIGNED_BYTE,buildTexture());
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.uniform1i(U.uTex,0);gl.uniform3fv(U.uGal,GAL);
}
try{initGL();}catch(e){gl=null;$('#nogl').style.display='block';}

/* ───────── 7. 천체 표시 · 기록 패널 ───────── */
function buildMarks(){const box=$('#marks');box.innerHTML='';
  for(const o of SCN[st.scene].list){const el=document.createElement('div');el.className='mk'+(o.dest?' dest':'')+(o.goal?' goal':'');
    el.innerHTML=(o.goal?'<i class="pulse"></i><i class="pulse"></i>':'')+'<b role="button" tabindex="-1" aria-label="'+o.ko+' 보기"></b><span>'+(o.dest?'▶ ':'')+o.ko+'</span>';
    const hit=el.querySelector('b'),lab=el.querySelector('span'),go=()=>select(o);o._t='';
    hit.addEventListener('click',go);lab.addEventListener('click',go);
    hit.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
    [hit,lab].forEach(x=>x.addEventListener('pointerdown',e=>e.stopPropagation()));
    box.appendChild(el);o.el=el;o.hit=hit;o.lab=lab;}}
function openInfo(on){$('#info').classList.toggle('open',on);$('#infoBtn').setAttribute('aria-expanded',on);$('#infoBtn').style.visibility=on?'hidden':'';}
const rowsHTML=rows=>rows.map(([k,ko,v,tag])=>'<div class="r"><span class="k">'+k+'<small>'+ko+'</small></span><span class="v">'+v+(tag?'<span class="chip">'+tag+'</span>':'')+'</span></div>').join('');
function renderInfo(){const sc=SCN[st.scene],o=st.sel;
  $('#vEn').textContent=sc.en;$('#vKo').textContent=sc.ko;
  if(o){
    $('#info').innerHTML='<button class="x" type="button" aria-label="닫기">닫기 ×</button><div class="hd"><span class="en">'+o.en+'</span><b>'+o.ko+'</b></div>'+rowsHTML(o.rows)+'<p>'+o.note+'</p>'+
      '<div class="act">'+(o.dest?'<button id="goObj" class="main" type="button">이 좌표로 이동 ▶</button>':'')+'<button id="unsel" type="button">◀ '+sc.ko+' 기록으로 복귀</button></div>';

      (sc.type?'<div class="act"><button id="pick" class="main" type="button">목적지로 확정 ▶</button></div>':'');
    const p=$('#pick');if(p)p.onclick=()=>{$('#endT').textContent='목적지 확정: '+sc.ko+' · 난이도 '+sc.level;$('#endv').classList.add('show');$('#endBack').focus();
      dispatchEvent(new CustomEvent('prologue:done',{detail:{name:st.name,planet:st.scene}}));};
  }

  $('#infoBtn').textContent=sc.ko+' 기록 ▸';
  $('#coast').hidden=st.scene!=='earth';if(st.scene!=='earth'){st.tcoast=0;$('#coast').setAttribute('aria-pressed','false');}
  $$('.stop').forEach(s=>{s.setAttribute('aria-current',s.dataset.b===st.scene);s.classList.toggle('next',st.scene==='earth'&&s.dataset.b==='b');});
  for(const x of SCN[st.scene].list)x.el&&x.el.classList.toggle('sel',x===o);}
const objDir=o=>o.kind==='local'?norm(SCN[st.scene].sph[o.sph].p):o.dir;
function select(o){if(st.phase!=='explore'||st.travel)return;st.sel=o;st.look=null;
  const d=objDir(o);let sd=sideOf(d),c=norm(add(mul(d,-1),mul(sd,.36)));
  if(dot(d,sideOf(mul(c,-1)))>0)c=norm(add(mul(d,-1),mul(sd,-.36)));
  animCam(c,o.kind==='local'?5.5:5,1900);renderInfo();openInfo(true);}
function deselect(){if(!st.sel)return;st.sel=null;renderInfo();}

/* ───────── 8. 이동 ───────── */
function travel(to){
  if(st.phase!=='explore'||st.travel||to===st.scene)return;
  const a=SCN[st.scene],b=SCN[to],far=!a.type||!b.type;
  const dir=far?(a.type?norm(mul(Tpos,-1)):dT):norm(a.sph[1].p);
  if(RM){setScene(to);const h=ypOf(b.home);st.yaw=h.yaw;st.pitch=h.pitch;st.dist=DHOME;return;}
  st.sel=null;st.anim=null;stopTour();
  if(!far){ // 같은 항성계(b↔c): 빨려 들어가는 효과 없이 한 화면에서 물러났다가 다음 행성으로 부드럽게 다가간다
    st.travel={glide:true,from:st.scene,to,t:performance.now(),dur:3800,y0:st.yaw,p0:st.pitch,d0:st.dist,c1:a.sph[1].p,o0:orbit(st.yaw,st.pitch)};
    openInfo(false);$$('.stop').forEach(s=>s.disabled=true);
    $('#warp').textContent=a.ko+' → '+b.ko;$('#warp').classList.add('on');return;}
  st.travel={from:st.scene,to,t:performance.now(),dur:far?6400:4200,dir,far,sw:false,
    y0:st.yaw,p0:st.pitch,d0:st.dist,tg:ypOf(norm(add(dir,[0,.35,0])))};
  st.travel.tg.yaw=st.yaw+Math.atan2(Math.sin(st.travel.tg.yaw-st.yaw),Math.cos(st.travel.tg.yaw-st.yaw));
  openInfo(false);$$('.stop').forEach(s=>s.disabled=true);
  $('#warp').textContent=a.ko+' → '+b.ko+(far?'':' · 동일 항성계 내 이동');$('#warp').classList.add('on');}
function setScene(k){st.scene=k;st.sel=null;buildMarks();renderInfo();}
$$('.stop').forEach(s=>s.onclick=()=>travel(s.dataset.b));
$('#infoBtn').onclick=()=>{st.sel=null;renderInfo();openInfo(true);$('#info .x').focus();};
$('#endBack').onclick=()=>$('#endv').classList.remove('show');
$('#logout').onclick=()=>{st.phase='idle';enterLogin();};
const ease=(a,b,k)=>a+(b-a)*k, eio=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
function stepGlide(now){ // b↔c: 출발 행성 둘레에서 살짝 물러나며 다음 행성 쪽으로 몸을 돌리고, 그 행성을 보며 곧장 다가간다 (출발 행성 좌표)
  const tr=st.travel,u=clamp((now-tr.t)/tr.dur,0,1),e=eio(u),b=SCN[tr.to],sph=SCN[tr.from].sph,C=tr.c1;
  const start=mul(tr.o0,tr.d0),end=add(C,mul(b.home,DHOME)),side=norm(add(tr.o0,b.home));
  let cam=add(add(start,mul(sub(end,start),e)),mul(side,3.2*Math.sin(Math.PI*u))); // 가운데쯤 옆으로 비켜 두 행성이 함께 보인다
  for(const o of sph){const v=sub(cam,o.p),l=len(v);if(l<o.r*1.6)cam=add(o.p,mul(norm(v),o.r*1.6));} // 행성 속을 지나가지 않게
  const aim=mul(C,eio(clamp(u/.45,0,1))); // 처음엔 출발 행성을 보다가 다음 행성으로 시선을 옮긴다
  st.look=norm(sub(aim,cam));
  const h=ypOf(b.home);st.yaw=h.yaw;st.pitch=h.pitch;st.dist=DHOME;st.ctr=sub(cam,mul(b.home,DHOME));
  st.sunR=ease(SCN[tr.from].sunR,b.sunR,e);
  st.ship=ease(SCN[tr.from].pos,b.pos,e);
  if(u>.82)$('#warp').classList.remove('on');
  if(u>=1){setScene(tr.to);st.ctr=[0,0,0];st.sunR=null;st.travel=null;st.look=null;$$('.stop').forEach(s=>s.disabled=false);
    setTimeout(()=>{if(!st.travel&&st.phase==='explore'&&!isMobile())openInfo(true);},900);}
  return [0,1];}
function stepTravel(now){
  if(st.travel.glide)return stepGlide(now);
  const tr=st.travel,u=clamp((now-tr.t)/tr.dur,0,1);let warp=0;
  const shipA=SCN[tr.from].pos,shipB=SCN[tr.to].pos;st.ship=ease(shipA,shipB,eio(clamp((u-.3)/.45,0,1)));let fade=1;
  if(u<.35){const e=(1-Math.cos(Math.PI*u/.35))/2;st.yaw=ease(tr.y0,tr.tg.yaw,e);st.pitch=ease(tr.p0,tr.tg.pitch,e);st.dist=Math.exp(ease(Math.log(tr.d0),Math.log(3.6),e));
    st.look=slerp(norm(mul(camPos(),-1)),tr.dir,e);}
  else if(u<.7){const w=(u-.35)/.35;warp=Math.pow(Math.sin(Math.PI*w),2)*(tr.far?1:.5);st.look=tr.dir;
    fade=1-.8*Math.exp(-Math.pow((u-.5)/.045,2));
    if(u>=.5&&!tr.sw){tr.sw=true;setScene(tr.to);const h=ypOf(mul(tr.dir,-1));st.yaw=h.yaw;st.pitch=h.pitch;st.dist=60;
      $$('.stop').forEach(s=>s.disabled=true);}}
  else{const e=(1-Math.cos(Math.PI*(u-.7)/.3))/2,good=SCN[tr.to].home,from=mul(tr.dir,-1),d=slerp(from,good,e),h=ypOf(d);
    st.yaw=h.yaw;st.pitch=h.pitch;st.dist=Math.exp(ease(Math.log(60),Math.log(DHOME),e));st.look=null;
    if(u>.74)$('#warp').classList.remove('on');}
  if(u>=1){st.travel=null;st.look=null;st.ship=shipB;$$('.stop').forEach(s=>s.disabled=false);
    setTimeout(()=>{if(!st.travel&&st.phase==='explore'&&!isMobile())openInfo(true);},1200);
    if(!RM){st.tour={t:now,dur:24000,y0:st.yaw,p0:st.pitch};$('#hint').textContent='궤도 선회 관측 중 · 드래그 시 중단';}}
  return [warp,fade];}

/* ───────── 9. 조작 ───────── */
const ptr=new Map();let pinch=null;
const viewMin=()=>{const r=$('#view').getBoundingClientRect();return Math.max(200,Math.min(r.width,r.height));};
cv.addEventListener('pointerdown',e=>{if(st.phase!=='explore'||st.travel)return;cv.setPointerCapture(e.pointerId);
  ptr.set(e.pointerId,[e.clientX,e.clientY,performance.now()]);st.anim=null;stopTour();document.body.classList.add('dragging');
  if(ptr.size===2){const [a,b]=[...ptr.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),z:st.dist};}});
cv.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;
  if(ptr.size>=2&&pinch){ptr.set(e.pointerId,[e.clientX,e.clientY,0]);const [a,b]=[...ptr.values()];st.dist=clamp(pinch.z*pinch.d/Math.max(10,Math.hypot(a[0]-b[0],a[1]-b[1])),DMIN,DMAX);return;}
  const dx=e.clientX-p[0],dy=e.clientY-p[1],now=performance.now(),dt=Math.max(1,now-p[2]),k=1.15/viewMin();
  st.yaw-=dx*k;st.pitch=clamp(st.pitch+dy*k,-1.35,1.35);st.vy=-dx*k/dt*1000;st.vp=dy*k/dt*1000;ptr.set(e.pointerId,[e.clientX,e.clientY,now]);});
let down=null;
cv.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY,performance.now()];});
cv.addEventListener('pointerup',e=>{if(!down||st.phase!=='explore'||st.travel)return;const [x0,y0,t0]=down;down=null;
  if(Math.hypot(e.clientX-x0,e.clientY-y0)>5||performance.now()-t0>400)return;
  const sc=SCN[st.scene],cam=camPos(),f=st.look||norm(mul(cam,-1)),r=sideOf(f),u=cross(r,f);
  const d=norm(add(f,add(mul(r,(e.clientX-st.cx)/st.F),mul(u,-(e.clientY-st.cy)/st.F))));
  let best=null,bt=1e9;sc.sph.forEach((o,i)=>{const oc=sub(cam,o.p),b=dot(oc,d),c=dot(oc,oc)-o.r*o.r,h=b*b-c;if(h>0){const t=-b-Math.sqrt(h);if(t>0&&t<bt){bt=t;best=i;}}});
  if(best===0){st.sel=null;renderInfo();openInfo(true);}
  else if(best!==null){const o=sc.list.find(x=>x.kind==='local'&&x.sph===best);if(o)select(o);}});
const pup=e=>{ptr.delete(e.pointerId);if(ptr.size<2)pinch=null;if(!ptr.size)document.body.classList.remove('dragging');};
cv.addEventListener('pointerup',pup);cv.addEventListener('pointercancel',pup);
cv.addEventListener('wheel',e=>{if(st.phase!=='explore'||st.travel)return;e.preventDefault();st.anim=null;stopTour();st.dist=clamp(st.dist*Math.exp(e.deltaY*.0006),DMIN,DMAX);},{passive:false});
const zoomBy=f=>{if(st.travel)return;animCam(orbit(st.yaw,st.pitch),clamp(st.dist*f,DMIN,DMAX),550);};
$('#coast').onclick=()=>{st.tcoast=st.tcoast?0:1;$('#coast').setAttribute('aria-pressed',String(!!st.tcoast));};
$('#zIn').onclick=()=>zoomBy(.72);$('#zOut').onclick=()=>zoomBy(1.4);
$('#home').onclick=()=>{if(st.travel)return;deselect();animCam(SCN[st.scene].home,DHOME,1900);};
addEventListener('keydown',e=>{if(st.phase!=='explore'||st.travel||e.target.tagName==='INPUT')return;
  const m={ArrowLeft:[.08,0],ArrowRight:[-.08,0],ArrowUp:[0,-.06],ArrowDown:[0,.06]}[e.key];
  if(m&&!(e.target.closest&&e.target.closest('#route,#info'))){e.preventDefault();st.anim=null;stopTour();st.yaw+=m[0];st.pitch=clamp(st.pitch+m[1],-1.35,1.35);}
  else if(e.key==='Escape')deselect();else if(e.key==='+'||e.key==='=')zoomBy(.72);else if(e.key==='-')zoomBy(1.4);});

/* ───────── 10. 매 프레임 ───────── */
let t0=performance.now(),prev=t0,raf=0;
function hitsSphere(o,d,maxT,skip){const sph=SCN[st.scene].sph;
  for(let i=0;i<sph.length;i++){if(i===skip)continue;const oc=sub(o,sph[i].p),b=dot(oc,d),c=dot(oc,oc)-sph[i].r*sph[i].r,h=b*b-c;
    if(h>0){const t=-b-Math.sqrt(h);if(t>0&&t<maxT)return true;}}return false;}
function frame(now){
  raf=requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-prev)/1000);prev=now;const T=(now-t0)/1000,k=1-Math.pow(.02,dt);
  const on=st.phase==='explore'||st.phase==='open';
  st.dim=ease(st.dim,on?1:(st.phase==='auth'?.9:.6),k);
  if(st.rev<st.trev)st.rev=Math.min(st.trev,st.rev+dt*.7);else st.rev=st.trev;
  st.coast=RM?st.tcoast:ease(st.coast,st.tcoast,1-Math.pow(.004,dt));
  let tg;if(on){const r=$('#view').getBoundingClientRect();tg={cx:r.left+r.width/2,cy:r.top+r.height/2,F:(isMobile()?.85:1.15)*Math.min(r.width,r.height)};}
  else tg=isMobile()?{cx:CW*.5,cy:CH*.27,F:CW*.95}:{cx:CW*.72,cy:CH*.5,F:CH*1.15};
  if(st.cx===null){st.cx=tg.cx;st.cy=tg.cy;st.F=tg.F;}
  const kk=RM?1:k*.9;st.cx=ease(st.cx,tg.cx,kk);st.cy=ease(st.cy,tg.cy,kk);st.F=ease(st.F,tg.F,kk);
  let warp=0;
  let fade=1;if(st.travel)[warp,fade]=stepTravel(now);
  else if(st.tour){const a=st.tour,u=clamp((now-a.t)/a.dur,0,1),e=eio(u);
    st.yaw=a.y0-e*Math.PI*.7;st.pitch=clamp(a.p0+Math.sin(u*Math.PI*2)*Math.sin(u*Math.PI)*.15,-1.35,1.35);st.dist=DHOME*(1-.08*Math.pow(Math.sin(u*Math.PI),2));
    if(u>=1){st.tour=null;$('#hint').textContent='드래그: 시점 회전 · 휠: 거리 조절';}}
  else{st.ship=SCN[st.scene].pos;
    if(st.anim){const a=st.anim,u=clamp((now-a.t)/a.dur,0,1),e=eio(u);st.yaw=ease(a.y0,a.y1,e);st.pitch=ease(a.p0,a.p1,e);
      st.dist=Math.exp(ease(Math.log(a.d0),Math.log(a.d1),e));if(u>=1)st.anim=null;}
    else if(!ptr.size){st.yaw+=st.vy*dt;st.pitch=clamp(st.pitch+st.vp*dt,-1.35,1.35);st.vy*=Math.pow(.004,dt);st.vp*=Math.pow(.004,dt);
      if(!on&&!RM)st.yaw+=dt*.015;}}
  $('#ship').style.left=st.ship+'%';
  const sc=SCN[st.scene],cam=camPos(),f=st.look||norm(mul(cam,-1)),r=sideOf(f),u=cross(r,f);
  const sph=on?sc.sph:[sc.sph[0]];
  if(gl){
    gl.uniform2f(U.uRes,W,H);gl.uniform2f(U.uCtr,st.cx/S,H-st.cy/S);gl.uniform1f(U.uF,st.F/S);
    gl.uniform1f(U.uT,T);gl.uniform1f(U.uDim,st.dim*fade);gl.uniform1f(U.uRev,st.rev);gl.uniform1f(U.uWarp,warp);gl.uniform1f(U.uCoast,st.coast);
    gl.uniform3fv(U.uCam,cam);gl.uniform3fv(U.uL,sc.L);gl.uniformMatrix3fv(U.uB,false,new Float32Array([...r,...u,...f]));
    const a=st.spin0+T*(RM?0:.035),c=Math.cos(a),s=Math.sin(a);gl.uniformMatrix3fv(U.uSpin,false,new Float32Array([c,0,-s,0,1,0,s,0,c]));
    const sp=new Float32Array(12),ty=new Float32Array([-1,-1,-1]);sph.forEach((o,i)=>{sp.set([...o.p,o.r],i*4);ty[i]=o.t;});
    gl.uniform4fv(U.uSph,sp);gl.uniform1fv(U.uTy,ty);
    gl.uniform4f(U.uSun,sc.L[0],sc.L[1],sc.L[2],st.sunR??sc.sunR);
    const ns=new Float32Array(32);sc.list.filter(o=>o.kind==='star').slice(0,8).forEach((o,i)=>ns.set([...o.dir,o.mag],i*4));gl.uniform4fv(U.uNS,ns);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
  // 천체 표시 위치
  const vr0=$('#view').getBoundingClientRect(),io=$('#info').classList.contains('open')&&!isMobile()?$('#info').getBoundingClientRect().width+30:0;
  const vr={left:vr0.left,top:vr0.top,right:vr0.right-io,bottom:vr0.bottom,width:vr0.width-io,height:vr0.height},pad=34;let selP=null;
  for(const o of sc.list){if(!o.el)continue;
    const isDir=o.kind!=='local',P=isDir?o.dir:sc.sph[o.sph].p,v=isDir?P:sub(P,cam),z=dot(v,f),X=dot(v,r),Y=dot(v,u);
    let x=st.cx+X/Math.max(z,1e-4)*st.F,y=st.cy-Y/Math.max(z,1e-4)*st.F;
    const inside=z>0&&x>vr.left+pad&&x<vr.right-pad&&y>vr.top+pad&&y<vr.bottom-pad;
    const occl=z>0&&hitsSphere(cam,isDir?P:norm(v),isDir?1e9:len(v),isDir?-1:o.sph);
    let mode='hide';
    if(on&&!st.travel){if(inside&&!occl)mode='show';else if(o.dest&&!inside)mode='edge';}
    o.el.classList.toggle('edge',mode==='edge');
    o.el.style.opacity=mode==='hide'?0:1;o.el.setAttribute('aria-hidden',mode==='hide');o.hit.style.pointerEvents=mode==='show'?'':'none';o.lab.style.pointerEvents=mode==='edge'?'auto':'none';o.hit.tabIndex=mode==='show'?0:-1;
    if(mode==='edge'){let dx=X,dy=-Y;if(z<=0&&Math.hypot(dx,dy)<1e-3)dx=1;const L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;
      const hw=vr.width/2-90,hh=vr.height/2-50,t=Math.min(Math.abs(hw/(dx||1e-6)),Math.abs(hh/(dy||1e-6)));
      const cx2=(vr.left+vr.right)/2;x=cx2+dx*Math.min(t,(vr.width/2-90)/Math.max(Math.abs(dx),1e-6));y=st.cy+dy*t;
      const ar=Math.abs(dx)>Math.abs(dy)?(dx>0?'→':'←'):(dy>0?'↓':'↑');o._t='';o.lab.textContent=(dx<0||(Math.abs(dy)>Math.abs(dx)))?ar+' '+o.ko+' 방향':o.ko+' 방향 '+ar;}
    else{const tx=(o.dest?'▶ ':'')+o.ko+(o.goal&&o.sub?'<small>'+o.sub+'</small>':'');if(o._t!==tx){o._t=tx;o.lab.innerHTML=tx;}}
    if(mode!=='hide')o.el.style.transform='translate('+Math.round(x)+'px,'+Math.round(y)+'px)';
    if(o===st.sel&&mode==='show')selP=[x,y];}
  const tk=$('#track');if(selP){tk.style.display='block';tk.style.transform='translate('+Math.round(selP[0]-22)+'px,'+Math.round(selP[1]-22)+'px)';}else tk.style.display='none';
}
addEventListener('pagehide',()=>cancelAnimationFrame(raf));

/* ───────── 11. 시작 ───────── */
resize();buildMarks();renderInfo();raf=requestAnimationFrame(frame);
const start=()=>{
  if(location.hash==='#explore'){st.phase='auth';st.name='테스트';st.trev=st.rev=1;document.body.classList.add('frame');$('#black').classList.remove('on');openView();}
  else if(!document.querySelector('video[data-prologue]'))enterLogin();};
(document.fonts&&document.fonts.load?document.fonts.load('16px UniPix'):Promise.resolve()).then(start,start);
})();
</script>
</body>
