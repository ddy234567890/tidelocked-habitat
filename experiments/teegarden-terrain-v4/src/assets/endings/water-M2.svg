<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 900">
  <!-- 엔딩 ② 철수 · 물 × 나눠 입주(M2). 팀 자체 제작 그림 (Claude, 2026-11-16). 밝기만 쓰고 색은 ending.js 필터가 게임 팔레트로 바꾼다 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050505"/><stop offset=".55" stop-color="#2a2a2a"/><stop offset="1" stop-color="#5a5a5a"/></linearGradient>
    <radialGradient id="star" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#ddd"/><stop offset="1" stop-color="#444" stop-opacity="0"/></radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#888" stop-opacity="0"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1c1c"/><stop offset="1" stop-color="#050505"/></linearGradient>
    <symbol id="p" viewBox="0 0 40 110"><circle cx="20" cy="14" r="12"/><rect x="8" y="8" width="24" height="8" rx="3" fill="#777"/><path d="M6 30q14-6 28 0l3 42h-6l-2 36h-8l-1-30-1 30h-8l-2-36H3z"/></symbol>
    <symbol id="pb" viewBox="0 0 40 110"><circle cx="24" cy="18" r="11"/><rect x="13" y="12" width="22" height="7" rx="3" fill="#777"/><path d="M8 34q14-4 26 2l2 38h-6l-2 34h-8l-1-28-2 28H9l-1-34H4z"/></symbol>
  </defs>
  <rect width="2100" height="900" fill="url(#sky)"/>
  <!-- 별들 (고정) -->
  <g fill="#bbb"><circle cx="140" cy="80" r="2"/><circle cx="420" cy="150" r="1.6"/><circle cx="700" cy="60" r="2.2"/><circle cx="980" cy="120" r="1.5"/><circle cx="1260" cy="50" r="2"/><circle cx="1500" cy="170" r="1.4"/><circle cx="1880" cy="90" r="2.4"/><circle cx="2020" cy="220" r="1.5"/><circle cx="300" cy="260" r="1.3"/><circle cx="1100" cy="240" r="1.2"/></g>
  <!-- 지평선 가까이 낮게 뜬 붉은 별 (팀 규칙상 밝은 빛으로만) -->
  <circle cx="330" cy="610" r="260" fill="url(#star)" opacity=".55"/>
  <circle cx="330" cy="610" r="70" fill="#f4f4f4"/>
  <!-- 떠나는 이주선: 하늘 오른쪽 위로 멀어지며, 창문에 기다리는 절반이 비친다 -->
  <g transform="translate(1640 170) rotate(12)">
    <path d="M-14 120 L14 120 L50 640 L-50 640Z" fill="url(#trail)" opacity=".5"/>
    <path d="M0 -110 L46 -40 L46 110 L-46 110 L-46 -40Z" fill="#9a9a9a"/>
    <path d="M-46 110 L-80 150 L-46 70Z M46 110 L80 150 L46 70Z" fill="#777"/>
    <g fill="#fff"><circle cx="0" cy="-30" r="11"/><circle cx="0" cy="5" r="11"/><circle cx="0" cy="40" r="11"/></g>
    <g fill="#333"><circle cx="-3" cy="-28" r="4"/><circle cx="3" cy="7" r="4"/><circle cx="-2" cy="42" r="4"/></g>
    <ellipse cx="0" cy="128" rx="26" ry="14" fill="#fff"/>
  </g>
  <!-- 먼 산등성이 -->
  <path d="M0 640 L180 600 L420 625 L700 570 L980 610 L1250 560 L1560 615 L1820 585 L2100 620 V900 H0Z" fill="#141414"/>
  <!-- 기지: 돔과 통로 (불이 거의 꺼져 있다) -->
  <g fill="#262626">
    <path d="M1150 700 a150 120 0 0 1 300 0Z"/><path d="M1460 700 a100 80 0 0 1 200 0Z"/><rect x="1430" y="660" width="50" height="40"/>
    <rect x="1660" y="672" width="160" height="28"/><path d="M1820 700 a70 60 0 0 1 140 0Z"/>
  </g>
  <g fill="#cfcfcf"><rect x="1290" y="645" width="14" height="10"/></g>
  <!-- 땅 -->
  <path d="M0 700 H2100 V900 H0Z" fill="url(#ground)"/>
  <g fill="#2a2a2a"><ellipse cx="200" cy="790" rx="90" ry="10"/><ellipse cx="900" cy="850" rx="140" ry="12"/><ellipse cx="1700" cy="820" rx="110" ry="9"/></g>
  <!-- 마지막 물탱크: 비어 있다. 바닥에 남은 물만 반짝이고, 아래 꼭지에서 한 방울 -->
  <g>
    <rect x="760" y="400" width="210" height="300" rx="16" fill="#3a3a3a"/>
    <ellipse cx="865" cy="400" rx="105" ry="22" fill="#4a4a4a"/>
    <rect x="780" y="425" width="170" height="250" rx="10" fill="#111"/>
    <rect x="780" y="660" width="170" height="15" rx="6" fill="#e6e6e6"/>
    <g stroke="#555" stroke-width="3"><line x1="790" y1="480" x2="808" y2="480"/><line x1="790" y1="540" x2="808" y2="540"/><line x1="790" y1="600" x2="808" y2="600"/></g>
    <rect x="770" y="700" width="20" height="40" fill="#333"/><rect x="940" y="700" width="20" height="40" fill="#333"/>
    <rect x="852" y="700" width="26" height="22" fill="#444"/><path d="M865 732 q-7 12 0 16 q7-4 0-16z" fill="#fff"/>
  </g>
  <!-- 줄 선 사람들: 먼저 내려온 절반. 꼭지 앞에서 기다리고, 뒤로 갈수록 고개를 들어 떠나는 배를 본다 -->
  <g fill="#7a7a7a">
    <use href="#p" x="905" y="640" width="52" height="143"/>
    <use href="#pb" x="985" y="642" width="52" height="143"/>
    <use href="#p" x="1068" y="648" width="50" height="138"/>
    <use href="#pb" x="1150" y="652" width="50" height="138"/>
    <use href="#p" x="1236" y="656" width="48" height="134"/>
    <use href="#pb" x="1320" y="660" width="48" height="134"/>
  </g>
  <!-- 빈 물통을 든 사람 (맨 앞) -->
  <g fill="#9a9a9a"><rect x="890" y="730" width="26" height="30" rx="4"/></g>
  <!-- 앞쪽 바위 -->
  <path d="M0 900 L0 820 Q80 790 160 815 T330 900Z" fill="#070707"/>
  <path d="M2100 900 V800 Q2000 780 1920 810 T1760 900Z" fill="#070707"/>
</svg>
